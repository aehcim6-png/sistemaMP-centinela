name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      # Escaneo de dependencias (checklist de seguridad, 2026-09-03): falla el
      # build solo ante vulnerabilidades ALTAS o CRÍTICAS ya conocidas y con
      # parche disponible — nivel "moderate" para abajo se reporta pero no
      # bloquea, para no frenar el pipeline por hallazgos de bajo impacto real
      # (frecuentes en devDependencies de build, nunca llegan al navegador).
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
